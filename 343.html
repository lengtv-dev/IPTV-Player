    <title>IPTV Player Portal - Live Streaming</title>
    <!-- ใช้ Tailwind CSS สำหรับจัดหน้าจอ -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- ใช้ Hls.js สำหรับเล่นสตรีมไฟล์ .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #0b0f19; }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- ================= 1. ส่วนหัวของเว็บ (Navbar) ================= -->
    <header class="bg-gray-950/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span class="text-2xl font-black text-red-500 tracking-wider">DOOTV PORTAL</span>
            <span class="text-xs bg-gray-800 text-gray-400 px-2.5 py-1 rounded-full border border-gray-700">M3U Playlist Player</span>
        </div>
        <div class="text-sm text-gray-400">
            จำนวนช่องทั้งหมด: <span id="total-channels" class="text-white font-bold">0</span> ช่อง
        </div>
    </header>

    <!-- ================= 2. พื้นที่เนื้อหาหลัก (Main Content) ================= -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden h-[calc(100vh-73px)]">
        
        <!-- ฝั่งซ้าย: เครื่องเล่นวิดีโอ (Video Player) -->
        <div class="w-full lg:w-2/3 bg-black flex flex-col justify-center relative border-b lg:border-b-0 lg:border-r border-gray-900">
            <div class="aspect-video w-full bg-black flex items-center justify-center relative shadow-inner">
                <video id="video-player" controls autoplay class="w-full h-full object-contain"></video>
            </div>
            
            <!-- รายละเอียดของช่องที่กำลังรับชม -->
            <div class="p-5 bg-gray-950/60 border-t border-gray-900 flex items-center gap-4">
                <img id="current-logo" src="https://placehold.co/150?text=TV" alt="Logo" class="h-16 w-16 object-contain bg-gray-900 rounded-xl p-1.5 border border-gray-800 transition-all">
                <div class="min-w-0 flex-1">
                    <span id="current-group" class="text-[10px] uppercase font-bold text-red-500 tracking-widest block mb-0.5">กรุณาเลือกช่อง</span>
                    <h2 id="current-title" class="text-xl font-bold text-gray-100 truncate">ยินดีต้อนรับสู่ระบบสตรีมมิ่ง</h2>
                    <p id="current-url" class="text-xs text-gray-500 mt-1 truncate">เลือกรายการด้านขวาเพื่อเริ่มต้นความบันเทิง</p>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: แท็บหมวดหมู่ และรายชื่อช่องตาม M3U -->
        <div class="w-full lg:w-1/3 flex flex-col bg-gray-950/20 h-full">
            <!-- แถบเลือกหมวดหมู่ย่อย (Group Title) ที่ดึงมาจาก M3U -->
            <div class="p-4 border-b border-gray-900 bg-gray-950/40">
                <span class="text-xs uppercase font-bold text-gray-400 block mb-2 tracking-wider">📁 หมวดหมู่รายการ</span>
                <div id="category-tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-950 font-bold">ทั้งหมด</button>
                </div>
            </div>

            <!-- กล่องแสดงรายชื่อช่อง -->
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="channel-list">
                <!-- รายการช่องจะถูกสร้างขึ้นตรงนี้ด้วย JavaScript -->
            </div>
        </div>

    </main>

                let line = lines[i].trim();
                if (!line) continue;

                // ตรวจสอบข้อมูลแท็กช่องทีวี
                if (line.startsWith('#EXTINF:')) {
                    currentItem = {};
                    
                    // ดึงลิงก์รูปภาพหน้าปก (tvg-logo)
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    currentItem.logo = logoMatch ? logoMatch[1] : "https://placehold.co/150?text=TV";

                    // ดึงกลุ่มหมวดหมู่ (group-title)
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    currentItem.category = groupMatch ? groupMatch[1] : "ทั่วไป";

                    // ดึงชื่อรายการ/ชื่อช่องทีวี (ข้อความด้านหลังเครื่องหมายคอมม่า `,`)
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentItem.name = line.substring(commaIndex + 1).trim();
                    } else {
                        currentItem.name = "ไม่มีชื่อช่อง";
                    }

                    // บันทึกหมวดหมู่ใหม่ที่เจอเก็บไว้แยกแท็บ
                    if (!categories.includes(currentItem.category)) {
                        categories.push(currentItem.category);
                    }
                } 
                // ตรวจสอบบรรทัดที่เป็นลิงก์วิดีโอสตรีมมิ่ง (ข้ามตัวเลือกเสริมอื่นๆ ไปก่อน)
                else if (line.startsWith('http://') || line.startsWith('https://')) {
                    if (currentItem) {
                        currentItem.url = line;
                        channels.push(currentItem);
                        currentItem = null; // รีเซ็ตเพื่อรอรับช่องถัดไป
                    }
                }
            }
            document.getElementById('total-channels').innerText = channels.length;
        }

        // --- 📁 ฟังก์ชันสร้างแท็บปุ่มกดหมวดหมู่รายการ ---
        function renderCategories() {
            const container = document.getElementById("category-tabs");
            container.innerHTML = "";

            categories.forEach(cat => {
                const isSelected = cat === activeCategory;
                const button = document.createElement("button");
                button.innerText = cat;
                button.className = `whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-semibold transition-all cursor-pointer ${
                    isSelected ? 'bg-red-600 text-white font-bold shadow-md shadow-red-900/40' : 'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-white'
                }`;

                button.onclick = () => {
                    activeCategory = cat;
                    renderCategories();
                    renderChannels();
                };
                container.appendChild(button);
            });
        }

        // --- 📺 ฟังก์ชันแสดงรายชื่อช่องทีวีลงในรายการด้านขวามือ ---
        function renderChannels() {
            const container = document.getElementById("channel-list");
            container.innerHTML = "";

            // กรองช่องตามหมวดหมู่ที่คลิกเลือกไว้
            const filteredChannels = activeCategory === 'ทั้งหมด' 
                ? channels 
                : channels.filter(ch => ch.category === activeCategory);

            if (filteredChannels.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 mt-8 text-xs">❌ ไม่พบช่องในหมวดหมู่นี้</p>`;
                return;
            }

            filteredChannels.forEach(item => {
                const card = document.createElement("div");
                card.className = "flex items-center gap-3 bg-gray-900/60 hover:bg-gray-800/80 p-2.5 rounded-xl border border-gray-800/60 hover:border-red-500/40 transition-all duration-150 cursor-pointer group";
                
                card.onclick = () => selectChannel(item);

                card.innerHTML = `
                    <div class="relative h-11 w-11 flex-shrink-0 bg-gray-950 rounded-lg overflow-hidden border border-gray-800 flex items-center justify-center p-1">
                        <img src="${item.logo}" alt="" class="h-full w-full object-contain" onerror="this.src='https://placehold.co/150?text=No+Img'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-xs font-bold text-gray-200 truncate group-hover:text-red-400 transition-colors">${item.name}</h4>
                        <p class="text-[10px] text-gray-500 mt-0.5 truncate">${item.category}</p>
                    </div>
                    <div class="text-gray-700 group-hover:text-red-500 transition-colors px-1">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" /></svg>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 🎥 ฟังก์ชันสลับการควบคุมเครื่องเล่นและส่งลิงก์วิดีโอไปเล่นสด ---
        function selectChannel(item) {
            const video = document.getElementById('video-player');
            
            // เปลี่ยนข้อความรายละเอียดด้านล่างตัวเล่น
            document.getElementById("current-title").innerText = item.name;
            document.getElementById("current-group").innerText = item.category;
            document.getElementById("current-url").innerText = `ลิงก์แหล่งที่มา: ${item.url}`;
            document.getElementById("current-logo").src = item.logo;

            // ตรวจสอบการสตรีมวิดีโอสดแบบ HLS (.m3u8)
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(item.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("รออนุญาตให้เล่นอัตโนมัติจากเบราว์เซอร์"));
                });
            } 
            // รองรับสำหรับ Safari / iOS เบราว์เซอร์โดยตรง
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = item.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            } else {
                alert("ขออภัย! เบราว์เซอร์นี้ไม่มีความสามารถในการถอดรหัสวิดีโอแบบสตรีมมิ่ง M3U8 ได้ครับ");
            }
        }
    </script>
</body>
